const rows=(m,c)=>KS.slice().sort((a,b)=>prog(m,c,b)-prog(m,c,a)).map(k=>{const p=prog(m,c,k),l=m.target-p;return '<div class="rr"><span>'+PF[k].e+' '+esc(sn(k))+'</span><div class="bar"><i style="width:'+Math.min(100,p/m.target*100)+'%;background:'+PF[k].col+'"></i></div><b>'+p+'/'+m.target+'</b></div>'+(l>0&&l<=Math.max(3,Math.ceil(m.target*.1))?'<div style="font-size:12px;margin:-2px 0 2px 80px">🔥 tinggal '+l+' warga lagi!</div>':'')}).join('');
function listHTML(){const c=X.cnt(),a=act();
 let h='<div style="margin-bottom:6px">👥 <b>Penduduk sekarang</b><br>'+KS.map(k=>PF[k].e+' '+esc(sn(k))+': <b>'+c[k]+'</b>').join(' · ')+'</div>';
 h+=a.length?a.map(m=>'<div class="mi"><b>🏆 '+esc(m.bangunan)+'</b><br><small>'+ttl(m)+'</small>'+rows(m,c)+'</div>').join(''):'<small>Belum ada misi rebutan yang aktif.</small>';
 const w=(X.M||[]).filter(m=>m.pemenang);if(w.length)h+='<div style="margin-top:8px"><b>✅ Sudah dimenangkan</b>'+w.map(m=>'<div style="font-size:13px">'+esc(m.bangunan)+' → '+(PF[m.pemenang]?PF[m.pemenang].e+' '+esc(PF[m.pemenang].n):esc(m.pemenang))+'</div>').join('')+'</div>';
 return h}
X.panel=listHTML;
const place=()=>{let b=0;['hud','pkc','pkl'].forEach(i=>{const e=document.getElementById(i);if(!e)return;const r=e.getBoundingClientRect();if(r.height>0&&getComputedStyle(e).display!=='none')b=Math.max(b,r.bottom)});el.style.top=(b+6)+'px'};
let sig='',osig='';
function render(){if(!X.cnt)return;const c=X.cnt(),a=act();let best=null;
 a.forEach(m=>{KS.forEach(k=>{const p=prog(m,c,k),r=p/m.target;if(!best||r>best.r)best={m,k,p,r}})});
 let h='<div>👥 '+KS.map(k=>PF[k].e+' '+c[k]).join(' · ')+'</div>';
 if(best){const l=best.m.target-best.p;h+='<div class="m">🏆 '+esc(best.m.bangunan)+': '+PF[best.k].e+' '+best.p+'/'+best.m.target+(l>0&&l<=Math.max(3,Math.ceil(best.m.target*.1))?' 🔥 '+l+' lagi':'')+'</div>'}
 else if(isAd())h+='<div class="m">⚙️ Belum ada misi — tap buat atur</div>';
 if(h!==sig){sig=h;el.innerHTML=h}el.style.display='';place();
 if(h!==osig&&pnl.style.display==='flex'&&!pnl.dataset.busy&&!isAd())openP(true);osig=h}
const bOpt=()=>{const s=new Set();CAT.forEach(c=>{const k=c[c.length-1];if((k===0||k===1)&&c[0])s.add(c[0])});return[...s]};
function openP(keep){const c=X.cnt(),sc=pnl.querySelector('.cd')?pnl.querySelector('.cd').scrollTop:0;
 let h='<h3>🏝️ Rebutan Bangunan</h3>'+(lastErr?'<div style="background:rgba(200,40,30,.15);border:1px solid #c0261a;border-radius:10px;padding:8px;margin:6px 0;font-size:13px;word-break:break-word">'+esc(lastErr)+'</div>':'')+listHTML();
 if(isAd()){
  h+='<hr style="border:0;border-top:1px solid var(--bd);margin:12px 0"><h3>⚙️ Atur Misi (admin)</h3>';
  if(X.ok===0)h+='<small style="color:#c0261a">Tabel misi belum ada di Supabase. Jalankan file misi-rebutan.sql dulu.</small>';
  h+='<small>Warga baru dihitung dari titik awal tiap misi. Ubah angka "warga baru" kalau mau atur progres pulau secara manual.</small>';
  (X.MS||[]).slice().sort((a,b)=>(a.pemenang?1:0)-(b.pemenang?1:0)||b._id-a._id).forEach(m=>{
   h+='<div class="mi" data-id="'+m._id+'"><div class="fr"><b>'+(m.pemenang?'✅':m.aktif?'🟢':'⏸️')+' '+esc(m.bangunan)+'</b>'+(m.pemenang?'<small>menang: '+esc(PF[m.pemenang]?PF[m.pemenang].n:m.pemenang)+'</small>':'')+'</div>';
   if(!m.pemenang){
    h+='<div class="fr"><select class="fb">'+bOpt().map(n=>'<option'+(n===m.bangunan?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select><span>target</span><input class="n ft" type="number" min="1" value="'+m.target+'"></div>'
    +'<div class="fr"><input class="fj" type="text" placeholder="Judul misi (opsional)" value="'+esc(m.judul||'')+'" style="flex:1"></div>'
    +'<div class="fr">'+KS.map(k=>PF[k].e+'<input class="n fp" data-k="'+k+'" type="number" min="0" max="'+c[k]+'" value="'+prog(m,c,k)+'">').join(' ')+'<small>warga baru</small></div>'
    +'<div class="fr"><button class="btn pri" data-a="sv">💾 Simpan</button><button class="btn" data-a="rs">🔄 Mulai dari 0</button><button class="btn" data-a="tg">'+(m.aktif?'⏸️ Jeda':'▶️ Aktifkan')+'</button><button class="btn red" data-a="dl">🗑️</button></div>'}
   else h+='<div class="fr"><button class="btn red" data-a="dl">🗑️ Hapus</button></div>';
   h+='</div>'});
  h+='<div class="mi" id="pkn"><b>➕ Misi baru</b><div class="fr"><select id="pkb">'+bOpt().map(n=>'<option'+(n==='Sekolah'?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select><span>target</span><input class="n" id="pkt" type="number" min="1" value="100"></div><div class="fr"><input id="pkj" type="text" placeholder="Judul misi (opsional)" style="flex:1"></div><div class="fr"><button class="btn pri" data-a="nw">Buat misi (hitung dari sekarang)</button></div></div>'}
 h+='<div class="fr" style="justify-content:flex-end"><button class="btn" data-a="x">Tutup</button></div>';
 pnl.innerHTML='<div class="cd">'+h+'</div>';pnl.style.display='flex';if(keep)pnl.querySelector('.cd').scrollTop=sc}
let lastErr='';const call=async(n,b)=>{const r=await fetch(RPC+n,{method:'POST',headers:H,body:JSON.stringify(b)});if(!r.ok){let t='';try{const j=await r.json();t=j.message||j.hint||JSON.stringify(j)}catch(e){}throw new Error(n+' → '+r.status+(t?': '+t:''))}return r};
pnl.onclick=async e=>{if(e.target===pnl){pnl.style.display='none';return}const bt=e.target.closest('[data-a]');if(!bt)return;const a=bt.dataset.a;if(a==='x'){pnl.style.display='none';return}
 const mi=bt.closest('.mi'),id=mi&&mi.dataset.id?+mi.dataset.id:0,c=X.cnt();pnl.dataset.busy=1;
 try{
  if(a==='nw'){const t=Math.max(1,Math.round(+$('pkt').value)||0);await call('buat_misi',{p_pin:adminPin,p_bangunan:$('pkb').value,p_target:t,p_judul:$('pkj').value||null});toast('Misi dibuat ✅')}
  else if(a==='sv'){const o={};mi.querySelectorAll('.fp').forEach(i=>{const k=i.dataset.k,v=Math.min(c[k],Math.max(0,Math.round(+i.value)||0));o[k]=c[k]-v});await call('atur_misi',{p_pin:adminPin,p_id:id,p_bangunan:mi.querySelector('.fb').value,p_target:Math.max(1,Math.round(+mi.querySelector('.ft').value)||1),p_judul:mi.querySelector('.fj').value,p_mulai:o});toast('Misi disimpan ✅')}
  else if(a==='rs'){await call('mulai_ulang_misi',{p_pin:adminPin,p_id:id});toast('Hitungan warga baru dimulai dari 0 ✅')}
  else if(a==='tg'){const m=X.MS.find(z=>z._id===id);await call('atur_misi',{p_pin:adminPin,p_id:id,p_aktif:!m.aktif});toast(m.aktif?'Misi dijeda':'Misi aktif')}
  else if(a==='dl'){if(!confirm('Hapus misi ini?'))throw 0;await call('hapus_misi',{p_pin:adminPin,p_id:id});toast('Misi dihapus')}
 lastErr=''}catch(err){if(err)lastErr='❌ Gagal: '+(err.message||err)+(/404|PGRST20|does not exist|schema cache/i.test(err.message||'')?' — kemungkinan misi-rebutan.sql belum dijalankan di Supabase.':/PIN/i.test(err.message||'')?' — PIN ditolak server.':'')}
 delete pnl.dataset.busy;await X.refresh();openP(true)};
el.onclick=()=>openP();
X.render=render;window.PKR={render};
setInterval(()=>{try{render()}catch(e){}},2000);addEventListener('resize',()=>{try{place()}catch(e){}});

/* ---------- TOMBOL 👁 SEMBUNYIKAN / MUNCULKAN SEMUA TOMBOL ---------- */
const ec=document.createElement('style');ec.textContent='#pkeye{position:fixed;z-index:19;right:8px;top:calc(150px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);font-size:18px;cursor:pointer;padding:0;opacity:.9}body.hideui #pkeye{opacity:.3}body.hideui>*:not(canvas):not(script):not(style):not(#pkeye):not(#toast):not(#modal):not([style*="pointer-events:none"]){display:none!important}';document.head.appendChild(ec);
const ey=document.createElement('button');ey.id='pkeye';ey.textContent='👁';document.body.appendChild(ey);
ey.onclick=()=>{const h=document.body.classList.toggle('hideui');ey.textContent=h?'🙈':'👁';pnl.style.display='none'};
render();
})();
</script>

<script>
/* ===== PATCH v3: ringan + tombol rapi + rumah tingkat + izin masuk (tanpa password) ===== */
(()=>{
const st=document.createElement('style');st.textContent='#bar{flex-wrap:nowrap;gap:5px}#bar .btn{padding:9px 9px;font-size:13px}#bar #bA{display:none}body.ed #bar #bA{display:inline-block}#pkl,#pkr{display:none!important}'
+'#pkmenu{display:none;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin:auto;max-width:420px;background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:8px;grid-template-columns:repeat(3,1fr);gap:6px;z-index:9}#pkmenu.open{display:grid}#pkmenu .btn{padding:9px 4px;font-size:12.5px}body.ed #pkmenu,body.ed #bMn{display:none!important}';
document.head.appendChild(st);
/* tombol: 5 utama + ☰ menu */
const bar=$('bar'),mn=document.createElement('div');mn.id='pkmenu';mn.className='ui';document.body.appendChild(mn);
[...bar.children].forEach(b=>{if(!['bO','bP','bS','bC','bR','bA'].includes(b.id))mn.appendChild(b)});
const mkb=(t,f)=>{const b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=f;mn.appendChild(b)};
mkb('⚙️ Admin',()=>$('bA').click());mkb('🏆 Peringkat',()=>$('pkl')&&$('pkl').click());mkb('🏝️ Rebutan',()=>$('pkr')&&$('pkr').click());
const mb=document.createElement('button');mb.className='btn';mb.id='bMn';mb.textContent='☰ Menu';bar.appendChild(mb);
mb.onclick=()=>mn.classList.toggle('open');mn.onclick=()=>mn.classList.remove('open');
document.addEventListener('pointerdown',e=>{if(!mn.contains(e.target)&&e.target!==mb)mn.classList.remove('open')});
/* culling: yang jauh dari kamera tidak dirender */
setInterval(()=>{try{const pv=mode==='pov',cx=pv?px:tgt.x,cz=pv?pz:tgt.z,R=pv?80:Math.max(70,dist*1.7);
for(const b of blds){if(!b.g)continue;const v=Math.hypot(b.x-cx,b.z-cz)<R+12;if(b.g.visible!==v)b.g.visible=v}
for(const c of chunks.values()){if(!c.g)continue;const v=Math.hypot((c.cx+.5)*C-cx,(c.cz+.5)*C-cz)<R+C*1.5;if(c.g.visible!==v)c.g.visible=v}}catch(e){}},400);
/* rumah tingkat */
let LV={};try{LV=JSON.parse(localStorage.getItem('pk-lv')||'{}')}catch(e){}
const COST=[0,0,100,250];
function floors(b){const g=b.g;if(!g||!g.children.length)return;if(b.fl&&b.fl.parent)b.fl.parent.remove(b.fl);const ig=g.children[0];ig.position.y=0;if(b.fp!==g||b.h0==null)b.h0=b.h;b.fp=g;b.fl=null;const lv=b.lv||1;b.h=b.h0;if(lv<2){if(b.name)relabel(b);return}
g.updateMatrixWorld(true);const bb=new THREE.Box3().setFromObject(ig),w=(bb.max.x-bb.min.x)*.96,d=(bb.max.z-bb.min.z)*.96,H=2.4*(lv-1),f=new THREE.Group();
const q=(w,h,dd,c,x,y,z,bs)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,dd),bs?new THREE.MeshBasicMaterial({color:c}):new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);f.add(m)};
q(w,H,d,0xe6dcc6,0,H/2,0);
for(let n=0;n<lv-1;n++)for(const s of[1,-1])for(let k=-1;k<=1;k++)if(!(n===0&&s===1&&k===0))q(.9,.9,.06,0x8fc4e8,k*w*.28,n*2.4+1.4,s*(d/2+.03),1);
q(.9,1.6,.08,0x5a3a22,0,.8,d/2+.04);q(w+.3,.18,d+.3,0x9a8f7a,0,H,0);
g.add(f);b.fl=f;ig.position.y=H;b.h=b.h0+H;if(b.name)relabel(b)}
setInterval(()=>{try{for(const b of blds){if(!b.auto||!b.pf||!b.g)continue;const lv=LV[b.name]||1;if((b.lv||1)!==lv||(lv>1&&b.fp!==b.g)){b.lv=lv;floors(b)}}}catch(e){}},2000);
async function pullLV(){try{const r=await fetch(API+'rumah_level?select=nama,lv',{headers:H});if(!r.ok)return;for(const x of await r.json())if(x.lv>(LV[x.nama]||1))LV[x.nama]=x.lv}catch(e){}}pullLV();setInterval(pullLV,20000);
async function upg(b){const nm=b.name,lv=(LV[nm]||1)+1,c=COST[lv];if(!c)return toast('Sudah tingkat maksimal');
if(PKX.get()<c)return toast('Koin kurang, butuh '+c+' 🪙');PKX.add(-c);LV[nm]=lv;try{localStorage.setItem('pk-lv',JSON.stringify(LV))}catch(e){}
try{fetch(API+'rumah_level?on_conflict=nama',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({nama:nm,lv})})}catch(e){}
toast('🏠 Rumahmu naik jadi tingkat '+lv+'!')}
/* tanpa password: pemilik = yang namanya di atas bangunan; orang lain minta izin lewat chat */
const ownerOf=b=>res.find(q=>!q.seed&&q.n===b.name),G2={};let lastC=null,pend=null;
houseDlg=async function(b){const nm=b.name||CAT[b.i][0],own=ownerOf(b),mine=me&&own&&String(own.id)===String(me.id);
if(mine){const lv=LV[nm]||1,x=[];if(lv<3)x.push({l:'⬆️ Upgrade ('+COST[lv+1]+' 🪙)',cb:()=>upg(b)});return modal({t:'🏠 '+esc(nm)+(lv>1?' · Tingkat '+lv:''),txt:'Ini rumahmu. Koinmu: 🪙 '+PKX.get(),x,ok:'🚪 Masuk',cb:()=>enterHouse(b)})}
if(admin)return modal({t:'🏠 '+esc(nm),txt:'Mode admin.',ok:'🚪 Masuk',cb:()=>enterHouse(b)});
if(!own)return modal({t:'🏠 '+esc(nm),txt:'Rumah ini belum ada penghuninya.',ok:'Tutup',cb:()=>{}});
if((G2[nm]||0)>Date.now())return enterHouse(b);
if(!me)return toast('Daftar jadi warga dulu untuk minta izin masuk');
modal({t:'🔒 '+esc(nm),txt:'Rumah ini hanya bisa dimasuki pemiliknya ('+esc(own.n)+'). Mau minta izin?',ok:'🙋 Minta izin',cb:async()=>{pend={b,own};await rpc('kirim_chat',{p_id:String(me.id),p_pesan:'🚪 '+me.n+' minta izin masuk rumah '+own.n+' 🙏'});toast('Permintaan terkirim, tunggu '+own.n+' menjawab')}})};
const rep=async(from,y)=>{await rpc('kirim_chat',{p_id:String(me.id),p_pesan:(y?'✅ ':'❌ ')+me.n+(y?' mengizinkan ':' menolak ')+from+(y?' masuk rumahnya':' masuk')})};
async function pollC(){if(document.hidden)return;const a=await rpc('baca_chat',{});if(!Array.isArray(a))return;const top=a.length?a[a.length-1].id:0;if(lastC===null){lastC=top;return}
for(const m of a){if(m.id<=lastC)continue;const t=String(m.pesan||'');let r;
if(me&&(r=t.match(/^🚪 (@\S+) minta izin masuk rumah (@\S+)/))&&r[2]===me.n&&r[1]!==me.n){const f=r[1];modal({t:'🚪 Izin masuk',txt:esc(f)+' minta izin masuk rumahmu.',x:[{l:'❌ Tolak',cb:()=>rep(f,0)}],ok:'✅ Izinkan',cb:()=>rep(f,1)})}
else if(me&&pend&&(r=t.match(/^(✅|❌) (@\S+) (?:mengizinkan|menolak) (@\S+)/))&&r[3]===me.n&&r[2]===pend.own.n){const b=pend.b;pend=null;if(r[1]==='✅'){G2[b.name]=Date.now()+6e5;toast('✅ Diizinkan, silakan masuk');enterHouse(b)}else toast('❌ Pemilik menolak izin masuk')}}
lastC=top}
pollC();setInterval(pollC,4000);
})();
</script>

<script>(()=>{const _sv=save;save=function(){_sv.apply(this,arguments);if(typeof mode!=='undefined'&&mode==='edit'&&window.PKX)setTimeout(()=>PKX.refresh(),1800)}})();</script>
